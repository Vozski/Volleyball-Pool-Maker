<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f5f4; --side:#ebebea; --paper:#ffffff; --ink:#151515; --muted:#76767b; --line:#e2e2e0; --rule:#ececea; --margin:rgba(224,57,45,.35);
  --accent:#e0392d; --hover:#e1e1df; --on-accent:#ffffff; --dot:#bdbdba;
  --ui:'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  --note:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121212;--side:#1a1a1a;--paper:#1c1c1c;--ink:#f1f1f1;--muted:#98989d;--line:#2d2d2f;--rule:#262628;--margin:rgba(255,90,77,.4);--accent:#ff5a4d;--hover:#262626;--on-accent:#1a0705;--dot:#4d4d50}
}
:root[data-theme="dark"]{--bg:#121212;--side:#1a1a1a;--paper:#1c1c1c;--ink:#f1f1f1;--muted:#98989d;--line:#2d2d2f;--rule:#262628;--margin:rgba(255,90,77,.4);--accent:#ff5a4d;--hover:#262626;--on-accent:#1a0705;--dot:#4d4d50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

.app{display:flex;min-height:100vh}
.side{width:280px;flex:none;background:var(--side);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:16px 12px;transition:margin-left .25s ease;z-index:20}
.app.collapsed .side{margin-left:-280px}
.brand{font-weight:600;font-size:17px;padding:4px 8px 14px}
.new{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;font-weight:500}
.new:hover{background:var(--hover)}
.new svg{color:var(--accent)}

.sec-title{font-weight:700;font-size:14px;padding:18px 10px 2px;color:var(--ink)}
.sec-desc{color:var(--muted);font-size:11px;padding:0 10px 6px;line-height:1.3}

.items{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.item{position:relative;display:block;width:100%;text-align:left;padding:8px 34px 8px 10px;border-radius:8px}
.item:hover{background:var(--hover)}
.item.active{background:var(--hover)}
.item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.item .n{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{display:block;color:var(--muted);font-size:13px}
.del{position:absolute;right:6px;top:8px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;font-size:12px}
.item:hover + .del,.del:hover,.del:focus-visible,.del.ask{opacity:1}
.del:hover{color:var(--accent)}
.del.ask{width:auto;padding:0 6px;color:var(--accent);font-weight:500}
.none{color:var(--muted);padding:6px 10px;font-size:14px}
.scrim{display:none}

.main{flex:1;min-width:0;padding:14px 20px 64px}
.top{display:flex;align-items:center;height:40px}
.tgl{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tgl:hover{background:var(--hover);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto}
.title{width:100%;border:0;background:transparent;color:var(--ink);font:600 28px/1.2 var(--ui);padding:18px 2px 14px;caret-color:var(--accent)}
.title::placeholder{color:var(--muted);opacity:.7}
.title:focus-visible{outline:0}

.paper{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.paper.drag{outline:2px dashed var(--accent);outline-offset:-6px}
.rows{position:relative;min-height:532px;max-height:4000px;overflow:hidden;transition:max-height .45s ease,min-height .45s ease;background:repeating-linear-gradient(to bottom,transparent 0,transparent 37px,var(--rule) 37px,var(--rule) 38px)}
.rows::before{content:"";position:absolute;left:56px;top:0;bottom:0;width:1px;background:var(--margin);pointer-events:none}
.row{position:relative;display:flex;height:38px;align-items:center}
.num{flex:none;width:56px;padding-right:12px;text-align:right;font:400 17px var(--note);color:var(--muted);font-variant-numeric:tabular-nums}
.row.extra .num{color:var(--accent)}
.row input{flex:1;min-width:0;height:38px;border:0;background:transparent;color:var(--ink);font:400 20px var(--note);padding:0 80px 0 16px;caret-color:var(--accent)}
.row input:focus-visible{outline:0}
.row input::placeholder{color:var(--muted);opacity:.65}
.up{position:absolute;top:3px;right:8px;z-index:3;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.up:hover{background:var(--hover);color:var(--accent)}
.hist{position:absolute;top:3px;right:44px;z-index:3;display:flex;gap:2px}
.hbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.hbtn:hover:not(:disabled){background:var(--hover)}
.hbtn:disabled{color:var(--muted);opacity:.4;cursor:default}
.veil{display:none;position:absolute;inset:0;z-index:2;cursor:pointer;align-items:flex-end;padding:0 0 8px 72px;color:var(--muted);font-size:14px;background:linear-gradient(to bottom,transparent 25%,var(--paper) 92%)}
.condensed .rows{min-height:0;max-height:114px}
.condensed .veil{display:flex}
.condensed .up,.condensed .hist{display:none}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-top:1px solid var(--line)}
.count{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.count.bad{color:var(--accent)}
.count.low{color:var(--muted)}
.state{color:var(--muted);font-size:13px}
.sp{flex:1}
.btn{padding:7px 12px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn[hidden],.send[hidden]{display:none}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);transition:background .2s,color .2s}
.send.ready{background:var(--accent);color:var(--on-accent)}
.send:hover.ready{filter:brightness(1.07)}
.msg{padding:0 18px 12px;font-size:14px;color:var(--muted)}
.msg:empty{display:none}
.msg.err{color:var(--accent)}

.pools{margin-top:28px}
.pools[hidden]{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pool{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pool h3{display:flex;align-items:baseline;justify-content:space-between;margin:0;padding:14px 18px 10px;font-size:15px;font-weight:500;color:var(--muted)}
.pool h3 b{font:500 30px/1 var(--note);color:var(--accent);margin-left:8px}
.pool h3 span{display:flex;align-items:baseline}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.slot{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tn{display:flex;flex-direction:column;font-weight:500;min-width:0}
.tn span{overflow-wrap:anywhere}
.sd{font:500 24px/1 var(--note);font-variant-numeric:tabular-nums}
.sd i{font-style:normal;color:var(--muted);font-size:15px;margin-right:1px}
.row.seed input.nm{padding-right:40px}
.row.seed input.sx{flex:none;width:92px;text-align:right;color:var(--muted);padding:0 18px 0 8px;font-variant-numeric:tabular-nums}
.dh{display:flex;align-items:center;gap:10px;height:38px;padding-left:72px;font-size:13px;color:var(--muted);pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden}
.dh b{font-weight:600;font-size:14px;color:var(--ink)}
.seglbl{color:var(--muted);font-size:13px}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--side)}
.seg button{padding:3px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow:visible}
.tab{position:relative;flex:none;padding:9px 12px;color:var(--muted);font-weight:500}
.tab:hover,.tab.on{color:var(--ink)}
.tab small{margin-left:6px;font-size:13px;font-weight:400;color:var(--muted)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
@media (max-width:520px){.seglbl{display:none}}
@media (prefers-reduced-motion:no-preference){
  .pools.in .pool{animation:rise .5s ease both}
  .pools.in .pool:nth-child(2){animation-delay:.07s}
  .pools.in .pool:nth-child(3){animation-delay:.14s}
  .pools.in .pool:nth-child(4){animation-delay:.21s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-100%);transition:transform .25s ease;margin-left:0!important;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .del{opacity:1}
  .main{padding:10px 12px 56px}
  .grid{grid-template-columns:1fr}
  .row input{font-size:18px}
}

.new.on{background:var(--hover)}
.item{display:flex;gap:10px;align-items:flex-start}
.item .tx{min-width:0;flex:1}
.fmt{flex:none;margin-top:1px;min-width:26px;height:22px;padding:0 5px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid var(--dot);color:var(--muted)}
.fmt.big{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dragging{opacity:.45}
.dtitle{margin:0;padding:18px 2px 14px;font:600 28px/1.2 var(--ui)}
.drop{display:grid;place-items:center;min-height:210px;padding:24px;text-align:center;border:2px dotted var(--dot);border-radius:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:rgba(224,57,45,.05)}
.drop.has{min-height:0;padding:14px 18px}
.drop h2{margin:0 0 6px;font-size:18px;font-weight:600}
.drop p{margin:0;color:var(--muted);max-width:46ch}
.drop p b{color:var(--ink)}
.drop select{margin-top:14px;max-width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.drop.has select{margin-top:10px}
#divTabs .tabs{margin-top:22px;margin-bottom:0}
.dmsg{color:var(--muted);padding:28px 4px}
.chead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;padding:10px 4px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:600}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rl{grid-column:1/-1;margin-top:18px;font-size:13px;font-weight:600;color:var(--accent)}
.mc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.mh{display:flex;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.mh .mn{font-weight:600;color:var(--ink)}
.mh .mp{margin-left:auto}
.mh .ct{display:none}
.tm{display:flex;flex-direction:column;font-size:17px;font-weight:500;line-height:1.3}
.tm span{overflow-wrap:anywhere}
.vs{margin:8px 0;font:italic 400 15px var(--note);color:var(--muted)}
.duty{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.duty i{font-style:normal;font-weight:600;color:var(--ink)}
@media (max-width:640px){.chead{display:none}.rd{grid-template-columns:1fr}.mh .ct{display:inline}.mh .mp{margin-left:0}}
.trow{display:flex;align-items:center;gap:8px}
.trow .title{flex:1;min-width:0;width:auto}
.bm{flex:none;width:40px;height:40px;margin-top:4px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.bm:hover{background:var(--hover);color:var(--ink)}
.bm svg{fill:none;transition:fill .15s}
.bm.on{color:var(--ink)}
.bm.on svg{fill:currentColor}

/* ---------- live draw ---------- */
.ldot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .ldot{animation:lpulse 1.9s ease-out infinite}
  @keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(224,57,45,.55)}70%{box-shadow:0 0 0 6px rgba(224,57,45,0)}100%{box-shadow:0 0 0 0 rgba(224,57,45,0)}}
}
.live-pill{display:inline-flex;align-items:center;gap:5px;flex:none;padding:2px 8px 2px 7px;border-radius:999px;border:1px solid var(--margin);color:var(--accent);font-size:11px;font-weight:700;line-height:1.3}
.livebtn .live-pill{margin-left:auto}
.lbar{display:flex;align-items:center;gap:12px}
.lbar .dtitle{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.lbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:500;font-size:14px}
.lbtn:hover{background:var(--hover)}
.lbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lbtn[disabled]{opacity:.5;cursor:default}
.ladd{display:grid;gap:12px;margin:0 0 20px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.ladd[hidden]{display:none}
.ladd label{font-weight:600;font-size:14px}
.ladd input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.ladd .lrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ladd .msg{padding:0}
.ladd .go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ladd .go:hover{filter:brightness(1.07);background:var(--accent)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lopen{display:flex;flex-direction:column;gap:10px;width:100%;min-height:128px;text-align:left;padding:16px 18px 14px;border-radius:12px}
.lopen:hover{background:var(--hover)}
.lopen h3{margin:0;padding-right:28px;font:500 19px/1.25 var(--note);overflow-wrap:anywhere}
.lopen .lm{color:var(--muted);font-size:13px}
.lopen .lf{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip.err{color:var(--accent)}
.chip .sd2{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.busy .sd2{animation:lblink 1s ease-in-out infinite}
@keyframes lblink{50%{opacity:.25}}
.ldel{position:absolute;right:8px;top:8px;min-width:28px;height:28px;padding:0 6px;border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.ldel:hover,.ldel.ask{color:var(--accent)}
.ldel.ask{font-weight:500}
.lempty{padding:34px 4px;color:var(--muted);max-width:56ch}
.lempty h2{margin:0 0 6px;color:var(--ink);font-size:18px;font-weight:600}
.lempty p{margin:0 0 10px}
.lempty pre{margin:0 0 12px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;overflow-x:auto}
.lback{display:inline-flex;align-items:center;gap:4px;margin:2px 0 0 -6px;padding:4px 8px 4px 4px;border-radius:8px;color:var(--muted);font-weight:500}
.lback:hover{background:var(--hover);color:var(--ink)}
.lsub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;color:var(--muted);font-size:13px}
.lsub a{color:var(--muted);text-decoration:underline}
.lsub a:hover{color:var(--ink)}
.lwarn{margin:14px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--margin);color:var(--accent);font-size:14px}
.lwarn p{margin:0}
.lwarn p+p{margin-top:4px}
#liveBody .tabs{margin-top:20px;margin-bottom:0}
#liveBody .tabs+.tabs{margin-top:0}
.lhd{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.lhd h2{margin:0;font:600 20px/1.2 var(--ui)}
.lhd .ct{color:var(--muted);font-size:14px}
.lhd .bm{margin:0}
.slist{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .rk{font:400 17px var(--note);color:var(--muted);font-variant-numeric:tabular-nums}
.srow.extra .rk{color:var(--accent)}
.srow .tn span.pl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.pl i{font-style:normal;font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.pl i.no{opacity:.75}
.tot{font:500 24px/1 var(--note);font-variant-numeric:tabular-nums;text-align:right}
.tot.zero{color:var(--muted)}
.cut{padding:8px 18px;border-top:1px solid var(--line);background:var(--bg);color:var(--accent);font-size:13px}
.lpools{margin-top:0}
.lnote{margin:10px 2px 0;color:var(--muted);font-size:12px}
@media (max-width:520px){.srow{padding:10px 14px;grid-template-columns:30px 1fr auto}.lbar .dtitle{font-size:24px}}
.lbar[hidden]{display:none}

/* ---------- wild cards ---------- */
.srow{position:relative;grid-template-columns:44px 1fr 30px auto}
.srow .rk{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.wcbadge{display:inline-flex;align-items:center;gap:3px;padding:1px 5px 1px 4px;border-radius:999px;border:1px solid var(--margin);color:var(--accent);font:700 9.5px/1.45 var(--ui);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;vertical-align:middle}
.wcbadge svg{flex:none}
.sd{display:flex;align-items:center;gap:8px}
.wcw{position:relative;width:30px;height:30px}
.wcopen{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .12s,background .12s,color .12s}
.srow:hover .wcopen,.srow:focus-within .wcopen,.wcopen:focus-visible,.wcw.open .wcopen{opacity:1}
.wcopen:hover{background:var(--hover);color:var(--accent)}
@media (hover:none){.wcopen{opacity:.65}}
.wcp{position:absolute;right:0;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:2px;padding:3px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.16);z-index:6;white-space:nowrap}
.wcw.open .wcp{display:flex}
.wcl{padding:0 8px 0 7px;font-size:12px;font-weight:600;color:var(--muted)}
.wca{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink)}
.wca:hover:not(:disabled){background:var(--hover);color:var(--accent)}
.wca:disabled{opacity:.25;cursor:not-allowed}
.wca.undo{color:var(--accent);background:rgba(224,57,45,.1)}
@media (prefers-reduced-motion:no-preference){
  .wcw.open .wcp{animation:wcin .13s ease both}
  @keyframes wcin{from{opacity:0;transform:translateY(-50%) scale(.92)}to{opacity:1;transform:translateY(-50%) scale(1)}}
}
.wcnote{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 14px;margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:14px}

<script>

  /* ---------- drag a row up or down (mouse or touch) ---------- */
  var GRIP_SVG = '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>';

      var n = document.createElement("span"); n.className = "n"; n.textContent = s.name;
      var m = document.createElement("span"); m.className = "m"; m.textContent = (s.total || 0) + " teams, " + (s.saved ? "saved" : "draft") + ", " + new Date(s.updated).toLocaleDateString(undefined, { day: "numeric", month: "short" });
      tx.appendChild(n); tx.appendChild(m); b.appendChild(f); b.appendChild(tx);
      b.addEventListener("click", function(){ openSnap(s.id); });
      var x = document.createElement("button"), t = null; x.type = "button"; x.className = "del"; x.setAttribute("aria-label", "Delete " + s.name); x.textContent = "\u2715";
      x.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(!x.classList.contains("ask")){ x.classList.add("ask"); x.textContent = "Delete?"; t = setTimeout(function(){ x.classList.remove("ask"); x.textContent = "\u2715"; }, 2500); return; }
        clearTimeout(t);
        snaps = snaps.filter(function(y){ return y.id !== s.id; }); saveSnaps();
        if(live.snap === s.id){ live.snap = null; renderLiveBody(); }
        renderSidebar();
      });
      wrap.appendChild(b); wrap.appendChild(x); box.appendChild(wrap);
    });
  }
  /* typing, dragging and keyboard shortcuts inside the live view */
  $("#liveBody").addEventListener("input", function(e){
    if(e.target.id === "liveQ"){ live.q = e.target.value; applyLiveFilter(); }
    else if(e.target.id === "snapName"){ var s = snapCur(); if(s){ s.name = e.target.value || "Snapshot"; saveSnaps(); renderSidebar(); } }
  });
  $("#liveBody").addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.target.id === "snAddName" || e.target.id === "snAddPts")){ e.preventDefault(); addSnapTeam(); }
  });
  $("#liveBody").addEventListener("pointerdown", function(e){
    var gp = e.target.closest(".grip"); if(!gp || e.button || !live.snap) return;
    var sl = gp.closest(".slist"); if(!sl) return;
    var start = +sl.dataset.start;
    startRowDrag(e, sl, ".srow.snap", function(from, to){
      snapEdit(function(sn){ var l = sn.lists[live.gender], x = l.splice(start + from, 1)[0]; l.splice(start + to, 0, x); });
    });
  });
  document.addEventListener("keydown", function(e){
    if(!live.snap || $("#liveView").hidden || !(e.ctrlKey || e.metaKey)) return;
    if(e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if(k === "z" && !e.shiftKey){ e.preventDefault(); snapUndo(); }
    else if(k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); snapRedo(); }
  });

  /* ----- events ----- */
  $("#liveBody").addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el || el.disabled) return;
    var act = el.dataset.act, d = liveDraw();
    if(snapAct(act, el, d)) return;
    if(act === "wcopen"){
      var w = el.closest(".wcw"), was = w.classList.contains("open");
      closeWc();
      if(!was){ w.classList.add("open"); var f = w.querySelector(".wca:not(:disabled)"); if(f) f.focus({ preventScroll: true }); }
      return;
    }
    if(act === "wc"){
      if(!d) return;
      closeWc();
      var key = el.dataset.k, dir = el.dataset.dir, before = {}, mv = d.teams.filter(function(t){ return t.key === key; })[0];
      if(!mv) return;
      d.teams.forEach(function(t){ before[t.key] = { division: t.division, gender: t.gender, name: teamName(t) }; });
      api("/api/draws/" + d.id + "/wildcard", { method: "POST", body: { key: key, dir: dir === "clear" ? null : dir } }).then(function(j){
        live.draws = live.draws.map(function(x){ return x.id === j.draw.id ? j.draw : x; });
        live.sig = live.ok + "|" + live.next + "|" + JSON.stringify(live.draws);   // so the next poll does not redraw for nothing
        live.wcNote = wcNote(d.id, before, j.draw, mv);
        renderLiveBody();
      }).catch(function(err){
        live.wcNote = { draw: d.id, err: true, lines: [/fetch|network/i.test(err.message) ? "Can\u2019t reach the live draw server, so the wild card was not saved." : err.message] };
        renderLiveBody();
      });
      return;
    }
    if(act === "wcx"){ live.wcNote = null; renderLiveBody(); return; }
    if(act === "wcgo"){ live.div = el.dataset.v; live.wcNote = null; renderLiveBody(); window.scrollTo(0, 0); return; }
    if(act === "open" || act === "back" || act === "gender" || act === "div") live.wcNote = null;
    if(act === "del"){
      if(!el.classList.contains("ask")){
        el.classList.add("ask"); el.textContent = "Delete?";
        setTimeout(function(){ el.classList.remove("ask"); el.textContent = "\u2715"; }, 2500);
        return;
      }
      api("/api/draws/" + el.dataset.id, { method: "DELETE" }).then(liveLoad).catch(function(){ liveLoad(); });
      return;
    }
    if(act === "retry"){ liveLoad(); return; }
    if(act === "refresh"){ if(d) api("/api/draws/" + d.id + "/refresh", { method: "POST" }).then(liveLoad).catch(function(){}); return; }
    if(act === "open"){ live.sel = el.dataset.id; live.gender = null; live.div = null; live.edit = false; $("#liveAdd").hidden = true; window.scrollTo(0, 0); }
    else if(act === "back"){ live.sel = null; }
    else if(act === "gender"){ live.gender = el.dataset.k; live.div = null; }
    else if(act === "div"){ live.div = el.dataset.v; }
    else if(act === "fav"){ if(d) toggleFav(d, live.gender, live.div); }
    renderLiveBody();
    syncEditBtn();
  });
  document.addEventListener("click", function(e){ if(!e.target.closest(".wcw")) closeWc(); });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    var o = document.querySelector(".wcw.open");
    if(o){ closeWc(); var b = o.querySelector(".wcopen"); if(b) b.focus({ preventScroll: true }); }
  });
  function syncEditBtn(){
    var b = $("#liveEdit"); b.classList.toggle("on", live.edit); b.setAttribute("aria-expanded", live.edit);
    b.querySelector("span").textContent = live.edit ? "Done" : "Edit";
  }
  $("#liveEdit").addEventListener("click", function(){
    live.edit = !live.edit; $("#liveAdd").hidden = !live.edit; syncEditBtn(); liveMsg("");
    renderLiveBody();
    if(live.edit) $("#liveUrl").focus();
  });
  document.querySelectorAll("#liveSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      live.size = +b.dataset.n;
      document.querySelectorAll("#liveSeg button").forEach(function(x){ var on = +x.dataset.n === live.size; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
    });
  });
  function liveCreate(){
    var url = $("#liveUrl").value.trim(), btn = $("#liveCreate");
    if(!url){ liveMsg("Paste a Majestri teams link first.", true); return; }
    btn.disabled = true; liveMsg("Adding\u2026");
    api("/api/draws", { method: "POST", body: { url: url, size: live.size } }).then(function(){
      $("#liveUrl").value = ""; liveMsg("");
      live.edit = false; $("#liveAdd").hidden = true; syncEditBtn();
      return liveLoad();
    }).catch(function(err){
      liveMsg(/fetch|network/i.test(err.message) ? "Can\u2019t reach the live draw server. Is node server.js running?" : err.message, true);
    }).then(function(){ btn.disabled = false; });
  }
  $("#liveCreate").addEventListener("click", liveCreate);
  $("#liveUrl").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); liveCreate(); } });
  $("#liveBtn").addEventListener("click", function(){ if(dirty && hasContent()) save(true); showView("live"); closeSide(); });
  $("#drawOut").addEventListener("click", function(e){ var b = e.target.closest("[data-ds]"); if(b){ drawSort = b.dataset.ds; renderDraw(); } });
  $("#drawOut").addEventListener("input", function(e){ if(e.target.id === "drawQ"){ drawQ = e.target.value; applyDrawFilter(); } });
  syncEditBtn();

  syncUI();
  renderRows();
  renderSidebar();
})();
</script>
</body>
</html>
